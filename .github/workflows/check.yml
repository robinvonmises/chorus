name: Prüfen

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: server
      - run: npx tsc -p . --noEmit
        working-directory: server
      - run: npm test
        working-directory: server
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm run build
        working-directory: web
