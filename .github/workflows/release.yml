name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release from docs/releases/<tag>.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/${TAG}.md"
          test -f "$notes" || { echo "missing $notes"; exit 1; }
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          gh release create "$TAG" --title "Chorus ${TAG#v}" --notes-file "$notes" --verify-tag
