<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest?v=2" />
    <link rel="icon" href="/icon.svg?v=2" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png?v=2" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" sizes="180x180" />
    <script>
      // Kann ein Skript nicht geladen werden (z. B. alte Version nach einem Update), einmal frisch neu laden statt leer zu bleiben
      (function () {
        function retry() {
          var last = Number(sessionStorage.getItem('inbox:reload') || 0);
          if (Date.now() - last > 30000) { sessionStorage.setItem('inbox:reload', String(Date.now())); location.reload(); }
        }
        window.addEventListener('error', function (e) { var t = e.target; if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) retry(); }, true);
        window.addEventListener('vite:preloadError', function (e) { e.preventDefault(); retry(); });
      })();
    </script>
    <title>Chorus</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
